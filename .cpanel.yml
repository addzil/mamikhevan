---
deployment:
  tasks:
    - export APP_ROOT="/home/mamikhev/repositories/mamikhevan"
    - export PUBLIC_ROOT="/home/mamikhev/public_html"
    - /bin/mkdir -p "$PUBLIC_ROOT"
    - cd "$APP_ROOT" && test -f .env || { echo "Missing production .env in $APP_ROOT" >&2; exit 1; }
    - cd "$APP_ROOT" && grep -Eq '^APP_ENV=production$' .env && grep -Eq '^APP_DEBUG=false$' .env && grep -Eq '^APP_KEY=.+$' .env || { echo "Invalid production .env in $APP_ROOT" >&2; exit 1; }
    - cd "$APP_ROOT" && [ -f database/database.sqlite ] || touch database/database.sqlite
    - cd "$APP_ROOT" && composer install --no-dev --optimize-autoloader --no-interaction
    - cd "$APP_ROOT" && npm ci --include=dev
    - cd "$APP_ROOT" && npm run build
    - cd "$APP_ROOT" && php artisan migrate --force
    - cd "$APP_ROOT" && php artisan config:cache && php artisan view:cache
    - if [ -e "$PUBLIC_ROOT/storage" ] && [ ! -L "$PUBLIC_ROOT/storage" ]; then echo "Move the existing public_html/storage directory before deployment" >&2; exit 1; fi
    - /bin/cp -R "$APP_ROOT/public/." "$PUBLIC_ROOT"/
    - /bin/sed -i "s#__DIR__\.'/\.\./#'$APP_ROOT/#g" "$PUBLIC_ROOT/index.php"
    - /bin/ln -sfn "$APP_ROOT/storage/app/public" "$PUBLIC_ROOT/storage"
