---
deployment:
  tasks:
    - export REPO_ROOT="/home/mamikhev/repositories/mamikhevan"
    - export APP_ROOT="/home/mamikhev/public_html/mamikhevan_shop"
    - export PUBLIC_ROOT="/home/mamikhev/public_html"
    - /bin/mkdir -p "$APP_ROOT" "$PUBLIC_ROOT"
    - /bin/cp "$REPO_ROOT/cpanel-main-domain/mamikhevan_shop/.htaccess" "$APP_ROOT/.htaccess"
    - if [ ! -f "$APP_ROOT/.env" ] && [ -f "$REPO_ROOT/.env" ]; then /bin/cp "$REPO_ROOT/.env" "$APP_ROOT/.env"; fi
    - cd "$APP_ROOT" && test -f .env || { echo "Missing production .env in $APP_ROOT" >&2; exit 1; }
    - cd "$APP_ROOT" && grep -Eq '^APP_ENV=production$' .env && grep -Eq '^APP_DEBUG=false$' .env && grep -Eq '^APP_KEY=.+$' .env || { echo "Invalid production .env in $APP_ROOT" >&2; exit 1; }
    - cd "$APP_ROOT" && grep -Eq '^DB_CONNECTION=mysql$' .env || { echo "Set DB_CONNECTION=mysql in $APP_ROOT/.env" >&2; exit 1; }
    - for d in app config resources routes; do /bin/mkdir -p "$APP_ROOT/$d"; /bin/cp -R "$REPO_ROOT/$d/." "$APP_ROOT/$d/"; done
    - /bin/mkdir -p "$APP_ROOT/bootstrap/cache" "$APP_ROOT/database" "$APP_ROOT/public" "$APP_ROOT/storage/app/public" "$APP_ROOT/storage/framework/cache" "$APP_ROOT/storage/framework/sessions" "$APP_ROOT/storage/framework/views" "$APP_ROOT/storage/logs"
    - /bin/cp "$REPO_ROOT/bootstrap/app.php" "$REPO_ROOT/bootstrap/providers.php" "$APP_ROOT/bootstrap/"
    - for d in factories migrations seeders; do /bin/mkdir -p "$APP_ROOT/database/$d"; /bin/cp -R "$REPO_ROOT/database/$d/." "$APP_ROOT/database/$d/"; done
    - /bin/cp -R "$REPO_ROOT/public/." "$APP_ROOT/public/"
    - /bin/cp "$REPO_ROOT/artisan" "$REPO_ROOT/composer.json" "$REPO_ROOT/composer.lock" "$REPO_ROOT/package.json" "$REPO_ROOT/package-lock.json" "$REPO_ROOT/vite.config.js" "$REPO_ROOT/tailwind.config.js" "$REPO_ROOT/postcss.config.js" "$REPO_ROOT/.npmrc" "$APP_ROOT/"
    - cd "$APP_ROOT" && composer install --no-dev --optimize-autoloader --no-interaction
    - cd "$APP_ROOT" && npm ci --include=dev
    - cd "$APP_ROOT" && npm run build
    - cd "$APP_ROOT" && php artisan migrate --force
    - cd "$APP_ROOT" && php artisan config:cache && php artisan view:cache
    - if [ -e "$APP_ROOT/public/storage" ] && [ ! -L "$APP_ROOT/public/storage" ]; then echo "Move the existing application public/storage directory before deployment" >&2; exit 1; fi
    - /bin/ln -sfn "$APP_ROOT/storage/app/public" "$APP_ROOT/public/storage"
    - /bin/cp "$REPO_ROOT/cpanel-main-domain/public_html/index.php" "$PUBLIC_ROOT/index.php"
    - /bin/cp "$REPO_ROOT/cpanel-main-domain/public_html/.htaccess" "$PUBLIC_ROOT/.htaccess"
